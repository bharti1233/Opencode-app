name: android
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # No setup-android: ubuntu-latest runners ship a preinstalled SDK
      # (ANDROID_SDK_ROOT set, licenses accepted). The setup-android@v3
      # action force-downloads stale cmdline-tools whose sdkmanager
      # --licenses fails on current images (run 1).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
